when:
  - event: [pull_request, push, manual]

variables:
  - &node_image 'node:lts-alpine'
  - &surge_image 'docker.io/woodpeckerci/plugin-surge-preview'
  - path: &site_path
      - 'site/**'
      - '.crow/site.yaml'
  - &site_work_path 'site'

steps:
  - name: lint-checks
    image: *node_image
    when:
      - path: *site_path
        event: [push, pull_request]
    directory: *site_work_path
    commands:
      - |
        if [[ "${CI_COMMIT_BRANCH}" == "main" ]]; then
          echo "Skipping prek-check on main branch"
          exit 0
        fi
        apk add uv git
        uv tool install prek
        SKIP=no-commit-to-branch /root/.local/bin/prek run -a --show-diff-on-failure

  - name: install-dependencies
    image: *node_image
    when:
      - path: *site_path
        event: [push, pull_request, manual]
    directory: *site_work_path
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile

  - name: build-site
    image: *node_image
    when:
      - path: *site_path
        event: [push, pull_request, manual]
    directory: *site_work_path
    commands:
      - corepack enable
      - pnpm build

  - name: deploy-site
    image: *node_image
    when:
      - branch: main
        event: [push, manual]
    directory: *site_work_path
    commands:
      - apk add git
      - corepack enable
      - pnpm run deploy
    environment:
      GIT_USER:
        from_secret: git_user
      GIT_PASS:
        from_secret: git_pat_docs_site
      GIT_USER_NAME: crow-bot
      GIT_USER_EMAIL: deploy@crow.bot

  - name: deploy-site-preview
    image: *surge_image
    when:
      - path: *site_path
        event: [pull_request, pull_request_closed]
    settings:
      path: 'site/build/'
      surge_token:
        from_secret: SURGE_TOKEN
      forge_repo_token:
        from_secret: GITHUB_TOKEN_SURGE
    failure: ignore

  - name: teardown-site-preview
    image: *surge_image
    when:
      - event: [push]
        branch: main
    commands:
      - |
        set -eu
        msg="${CI_COMMIT_MESSAGE}"
        echo "Debug: Commit message is: $msg"
        # Use printf %s to ensure the string is handled literally,
        # preventing the shell from trying to execute 'pull' as a command.
        pr=$(printf '%s' "$msg" | grep -oE 'pull request #[0-9]+' | grep -oE '[0-9]+' | head -n 1)
        if [ -z "${pr:-}" ]; then
          echo "No PR number found; skipping teardown."
          exit 0
        fi
        domain="${CI_REPO_OWNER}-${CI_REPO_NAME}-pr-${pr}.surge.sh"
        echo "Tearing down Surge preview: $domain"
        surge teardown "$domain"
    environment:
      SURGE_TOKEN:
        from_secret: SURGE_TOKEN
    failure: ignore
