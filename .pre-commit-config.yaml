default_install_hook_types: # Determines hooks installed by `prek install --install-hooks`.
-   commit-msg
-   pre-commit
-   pre-push

fail_fast: true # Stops on first hook failure.

repos:
-   repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: b09f43ffbb3529a643f6616844e226148c622d3c # frozen: v0.10.0
    hooks:
    -   id: pre-commit-update
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
    -   id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose] # Failure output helps teach Conventional Commit requirements.
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
    -   id: no-commit-to-branch
        args: [--branch, master, --branch, main] # Place protected branches here to save headache.
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: mixed-line-ending
    -   id: check-added-large-files
        args: ['--maxkb=1024']
    -   id: check-json
    -   id: check-yaml
        args:
        -   --allow-multiple-documents
-   repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # frozen: v0.50.0
    hooks:
    -   id: markdownlint
        args:
        -   "--fix"
